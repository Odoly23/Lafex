{% extends 'frontend/base.html' %}{% load static %}
{% block title %}{{ T.review_title }} - Lafex{% endblock %}
{% block content %}
<section id="review">
  <div class="hero small">
    {% include 'frontend/_mascot.html' with size='80' %}
    <h1>{{ T.review_title }}</h1>
  </div>
  <p id="note" class="note" aria-live="polite"></p>
  <div id="list"></div>
  <p><a href="/">{{ T.back }}</a></p>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="{% static 'frontend/js/review.js' %}"></script>{% endblock %}
