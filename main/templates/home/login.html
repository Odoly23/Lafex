{% extends 'main/layout.html' %}{% load static %}
{% block content %}
<div class="row justify-content-center">
	<div class="col-md-6 col-lg-5">
		<div class="card shadow-sm">
			<div class="card-body">
				{% include 'main/_mascot.html' with size='150' %}
				<h1 class="h4 text-center">{{ T.login_title }}</h1>
				<p class="text-center text-muted">{{ T.login_sub }}</p>

				<form id="form-email">
					<div class="form-group">
						<label for="email">{{ T.email_label }}</label>
						<input id="email" class="form-control form-control-lg" type="email" inputmode="email" autocomplete="email" required>
					</div>
					<button class="btn btn-primary btn-lg btn-block" type="submit">{{ T.send_code }}</button>
				</form>

				<form id="form-code" hidden>
					<p id="code-sent" class="note"></p>
					<div class="form-group">
						<label for="code">{{ T.code_label }}</label>
						<input id="code" class="form-control form-control-lg text-center" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
					</div>
					<button class="btn btn-primary btn-lg btn-block" type="submit">{{ T.enter }}</button>
					<button id="btn-resend" class="btn btn-link btn-block" type="button">{{ T.resend }}</button>
				</form>
				<p id="msg" class="msg text-center" role="alert"></p>
			</div>
		</div>
	</div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{% static 'main/js/login.js' %}"></script>{% endblock %}
